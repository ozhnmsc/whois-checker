<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain Date Checker</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --line:#e4e4df;
          --accent:#2f5d50; --warn:#b4541a; --bad:#a32020; --ok:#2f7a3f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --text:#ecebe6; --muted:#9a9993; --line:#33332f;
            --accent:#7fb8a6; --warn:#e39a5a; --bad:#e57373; --ok:#7cc48a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .lang { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex-shrink:0; }
  .lang button { padding:4px 10px; border:none; border-radius:0; background:transparent;
                 color:var(--muted); font-size:12px; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:var(--bg); }
  p.sub { color:var(--muted); margin:0 0 20px; }
  textarea { width:100%; min-height:140px; padding:12px; border:1px solid var(--line);
             border-radius:8px; background:var(--card); color:var(--text);
             font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; resize:vertical; }
  .bar { display:flex; gap:8px; align-items:center; margin:12px 0 20px; flex-wrap:wrap; }
  button { padding:8px 16px; border-radius:6px; border:1px solid var(--accent);
           background:var(--accent); color:var(--bg); font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #progress, #count { color:var(--muted); font-size:13px; }
  #count.over { color:var(--bad); font-weight:600; }
  .bar.bottom { margin:12px 0 0; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
       cursor:pointer; user-select:none; }
  tr:last-child td { border-bottom:none; }
  td.num { font-variant-numeric: tabular-nums; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  .empty { padding:28px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title">Domain Date Checker</h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="tr" aria-pressed="false">TR</button>
    </div>
  </header>
  <p class="sub" data-i18n="sub">Paste domains (one per line, or separated by commas/spaces). Shows registration and expiry dates via RDAP, with WHOIS fallback.</p>

  <textarea id="input" placeholder="example.com&#10;google.com&#10;mysite.com.tr"></textarea>
  <div class="bar">
    <button id="run" data-i18n="run">Check domains</button>
    <span id="count"></span>
    <span id="progress"></span>
  </div>

  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="domain" data-i18n="th_domain">Domain</th>
        <th data-k="state" data-i18n="th_state">Status</th>
        <th data-k="created" data-i18n="th_created">Registered</th>
        <th data-k="age" data-i18n="th_age">Age</th>
        <th data-k="expires" data-i18n="th_expires">Expires</th>
        <th data-k="left" data-i18n="th_left">Days left</th>
        <th data-k="registrar" data-i18n="th_registrar">Registrar</th>
        <th data-k="source" data-i18n="th_source">Source</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">No results yet.</td></tr></tbody>
    </table>
  </div>
  <div class="bar bottom">
    <button id="xlsx" class="secondary" data-i18n="xlsx" disabled>Download Excel</button>
    <button id="csv" class="secondary" data-i18n="csv" disabled>Download CSV</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

const STRINGS = {
  en: {
    pageTitle: "Domain Date Checker",
    title: "Domain Date Checker",
    sub: "Paste domains (one per line, or separated by commas/spaces). Shows registration and expiry dates via RDAP, with WHOIS fallback.",
    run: "Check domains", csv: "Download CSV", xlsx: "Download Excel",
    sheet: "Domains",
    count: (n, max) => `${n} / ${max} domains`,
    tooMany: (n, max) => `${n} domains: the limit is ${max} per check`,
    xlsxFailed: "Excel export could not be loaded. Try again or use CSV.",
    th_domain: "Domain", th_state: "Status", th_created: "Registered", th_age: "Age",
    th_expires: "Expires", th_left: "Days left", th_registrar: "Registrar", th_source: "Source",
    empty: "No results yet.",
    registered: "Registered", available: "Not registered", error: "Error",
    yrs: "yrs",
    progress: (d, n) => `${d} / ${n} checked`,
    done: (n) => `Done: ${n} domains`,
  },
  tr: {
    pageTitle: "Alan Adı Tarih Kontrolü",
    title: "Alan Adı Tarih Kontrolü",
    sub: "Alan adlarını yapıştırın (her satıra bir tane ya da virgül/boşlukla ayırarak). Kayıt ve bitiş tarihleri RDAP ile, gerekirse WHOIS ile sorgulanır.",
    run: "Alan adlarını kontrol et", csv: "CSV indir", xlsx: "Excel indir",
    sheet: "Alan adları",
    count: (n, max) => `${n} / ${max} alan adı`,
    tooMany: (n, max) => `${n} alan adı: tek seferde en fazla ${max} kontrol edilebilir`,
    xlsxFailed: "Excel dışa aktarma yüklenemedi. Tekrar deneyin ya da CSV kullanın.",
    th_domain: "Alan adı", th_state: "Durum", th_created: "Kayıt tarihi", th_age: "Yaş",
    th_expires: "Bitiş tarihi", th_left: "Kalan gün", th_registrar: "Kayıt şirketi", th_source: "Kaynak",
    empty: "Henüz sonuç yok.",
    registered: "Kayıtlı", available: "Kayıtlı değil", error: "Hata",
    yrs: "yıl",
    progress: (d, n) => `${d} / ${n} kontrol edildi`,
    done: (n) => `Tamamlandı: ${n} alan adı`,
  },
};

function initialLang() {
  try { const saved = localStorage.getItem("lang"); if (STRINGS[saved]) return saved; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
}
let lang = initialLang();
const t = (k, ...a) => { const v = STRINGS[lang][k]; return typeof v === "function" ? v(...a) : v; };
let progress = null; // ["progress", done, total] or ["done", n]

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll(".lang button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("progress").textContent = progress ? t(...progress) : "";
  updateCount();
  render();
}

document.querySelectorAll(".lang button").forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
});

function setProgress(...p) { progress = p; $("progress").textContent = t(...p); }

let results = [];
let sortKey = null, sortDir = 1;

function parseDate(s) {
  if (!s) return null;
  const d = new Date(String(s).replace(/\s*\(.*\)$/, "").trim());
  return isNaN(d) ? null : d;
}
const fmt = (d) => d ? d.toISOString().slice(0, 10) : "—";
const dayMs = 86400000;

function enrich(r) {
  const c = parseDate(r.created), e = parseDate(r.expires);
  const now = Date.now();
  return {
    ...r,
    createdD: c, expiresD: e,
    age: c ? (now - c) / dayMs / 365.25 : null,
    left: e ? Math.floor((e - now) / dayMs) : null,
    state: r.error ? "error" : r.registered === false ? "available" : "registered",
  };
}

function render() {
  const rows = [...results];
  if (sortKey) rows.sort((a, b) => {
    const va = a[sortKey + "D"] ?? a[sortKey], vb = b[sortKey + "D"] ?? b[sortKey];
    if (va == null) return 1; if (vb == null) return -1;
    return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir;
  });
  $("rows").innerHTML = rows.length ? rows.map((r) => {
    const st = r.state === "registered" ? `<span class="pill ok">${t("registered")}</span>`
             : r.state === "available" ? `<span class="pill warn">${t("available")}</span>`
             : `<span class="pill bad" title="${esc(r.error)}">${t("error")}</span>`;
    const leftCls = r.left == null ? "muted" : r.left < 30 ? "bad" : r.left < 90 ? "warn" : "";
    return `<tr>
      <td><strong>${esc(r.domain)}</strong></td>
      <td>${st}</td>
      <td class="num">${fmt(r.createdD)}</td>
      <td class="num">${r.age != null ? r.age.toLocaleString(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " " + t("yrs") : "—"}</td>
      <td class="num">${fmt(r.expiresD)}</td>
      <td class="num ${leftCls}">${r.left ?? "—"}</td>
      <td>${esc(r.registrar || "—")}</td>
      <td class="muted">${esc(r.source || "")}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="8" class="empty">${t("empty")}</td></tr>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

async function check(domain) {
  try {
    const r = await fetch("/api/whois?domain=" + encodeURIComponent(domain));
    return enrich(await r.json());
  } catch (e) {
    return enrich({ domain, error: e.message });
  }
}

// Keeps each run short and avoids tripping registry rate limits.
const MAX_DOMAINS = 50;
let running = false;

const getList = () =>
  [...new Set($("input").value.split(/[\s,;]+/).map((s) => s.trim()).filter(Boolean))];

function updateCount() {
  const n = getList().length, over = n > MAX_DOMAINS;
  $("count").textContent = n ? t(over ? "tooMany" : "count", n, MAX_DOMAINS) : "";
  $("count").classList.toggle("over", over);
  $("run").disabled = running || over;
}
$("input").addEventListener("input", updateCount);

function setExportsDisabled(v) { $("csv").disabled = v; $("xlsx").disabled = v; }

$("run").onclick = async () => {
  const list = getList();
  if (!list.length || list.length > MAX_DOMAINS) return;
  results = []; render();
  running = true; $("run").disabled = true; setExportsDisabled(true);

  let done = 0, i = 0;
  const worker = async () => {
    while (i < list.length) {
      const d = list[i++];
      results.push(await check(d));
      done++; setProgress("progress", done, list.length);
      render();
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, list.length) }, worker));

  running = false; updateCount(); setExportsDisabled(!results.length);
  setProgress("done", results.length);
};

document.querySelectorAll("th").forEach((th) => th.onclick = () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render();
});

$("csv").onclick = () => {
  const head = ["domain","status","registered","expires","days_left","registrar","source","error"];
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.join(",")].concat(results.map((r) => [
    r.domain, r.state, fmt(r.createdD), fmt(r.expiresD), r.left, r.registrar, r.source, r.error
  ].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "domain-dates.csv"; a.click();
};

// SheetJS is only loaded when someone actually exports to Excel.
let xlsxLib = null;
function loadXlsx() {
  return xlsxLib ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js";
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { xlsxLib = null; reject(new Error("load failed")); };
    document.head.appendChild(s);
  });
}

// Excel date serial (days since 1899-12-30) for the UTC calendar day, as a whole number.
const excelDate = (d) => d
  ? { t: "n", v: (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(1899, 11, 30)) / dayMs,
      z: "yyyy-mm-dd" }
  : null;

$("xlsx").onclick = async () => {
  let XLSX;
  try { XLSX = await loadXlsx(); } catch { $("progress").textContent = t("xlsxFailed"); return; }
  const keys = ["domain", "state", "created", "age", "expires", "left", "registrar", "source"];
  const rows = results.map((r) => [
    r.domain, t(r.state), excelDate(r.createdD),
    r.age != null ? Math.round(r.age * 10) / 10 : null,
    excelDate(r.expiresD), r.left, r.registrar || null, r.source || null, r.error || null,
  ]);
  const head = keys.map((k) => t("th_" + k)).concat(t("error"));
  const ws = XLSX.utils.aoa_to_sheet([head, ...rows]);
  ws["!cols"] = [28, 14, 12, 8, 12, 10, 34, 26, 30].map((wch) => ({ wch }));
  ws["!autofilter"] = { ref: ws["!ref"] };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, t("sheet"));
  XLSX.writeFile(wb, "domain-dates.xlsx");
};

applyLang();
</script>
</body>
</html>
